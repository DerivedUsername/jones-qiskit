[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jones-qiskit"
version = "0.1.0"
description = "Aharonov–Jones–Landau Jones polynomial estimation in Qiskit"
requires-python = ">=3.11"
authors = [{ name = "Qiyu Zhang" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
